<style>body{font:13px Inter,Arial,sans-serif;padding:20px;color:#222222}h2{font-size:23px;letter-spacing:-1px}p{line-height:1.6;color:#666666}label{display:block;border:1px dashed #999999;padding:24px;text-align:center;background:#f5f5f5;cursor:pointer}input{display:block;margin-top:16px;width:100%}button{background:#000000;color:#ffffff;padding:12px;border:1px solid #a5a5a5;width:100%;margin-top:16px;cursor:pointer}#error{color:#5e5e5e}</style><h2>Logotyper</h2><p>Choose individual wordmark SVGs or your exported selection sheet. All lettering arrives as editable vector paths.</p><label>Choose SVG files<input id="files" type="file" multiple accept=".svg"></label><button id="import">Import onto canvas ↗</button><p id="error"></p><script>document.getElementById('import').onclick=async()=>{const files=[...document.getElementById('files').files];if(!files.length){document.getElementById('error').textContent='Choose an SVG first.';return}parent.postMessage({pluginMessage:{type:'import',files:await Promise.all(files.map(async f=>({name:f.name,svg:await f.text()}))) }},'*')};onmessage=e=>{if(e.data.pluginMessage?.error)document.getElementById('error').textContent=e.data.pluginMessage.error};</script>
